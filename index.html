// true si la persona está escribiendo / tiene abierto un formulario: no repintar (si no, el refresco automático le borra lo que estaba cargando)
function editando(){const a=document.activeElement;return !!(document.querySelector('#sheet:not(.hide)')||(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))||document.querySelector('details[open]')||[...document.querySelectorAll('video')].some(v=>v.currentTime>0&&!v.ended))}
async function cargar(silencio,liv){
  try{
    if(liv&&S.cargado){const [ma,cf]=await Promise.all([rest('mm_matches','select=*&order=id'),rest('mm_config','select=*')]);S.matches=ma;S.mby={};ma.forEach(m=>S.mby[m.id]=m);S.cfg={};cf.forEach(c=>S.cfg[c.clave]=c.valor);S.err='';S.last=Date.now();if(!editando())pintar();return}
    const [pl,ma,cf]=await Promise.all([rest('mm_players','select=*&order=id'),rest('mm_matches','select=*&order=id'),rest('mm_config','select=*')]);
    pl.forEach(p=>p.fh=fh(p.bandera));S.players=pl;S.by={};pl.forEach(p=>S.by[p.id]=p);S.matches=ma;S.mby={};ma.forEach(m=>S.mby[m.id]=m);
    S.cfg={};cf.forEach(c=>S.cfg[c.clave]=c.valor);
    S.rank=await rpc('mm_ranking');
    if(S.ses&&S.ses.id){const r=await rpc('mm_mis_picks',{p_player:S.ses.id,p_pin:S.ses.pin});if(r.ok)S.picks=r.picks;}
    S.cargado=true;S.err='';
    if(!S.riSet){S.ri=rondaActual();S.riSet=true;}
  }catch(e){S.err='Sin conexión con el servidor. Mostrando lo último que se vio.';if(!silencio&&!S.cargado)S.err='No pude conectarme al servidor. Revisá tu internet.';}
  if(!(silencio&&S.cargado&&editando()))pintar();
}
function rondaActual(){for(let i=0;i<RONDAS.length;i++){const l=delRonda(RONDAS[i]);if(l.some(m=>m.estado!=='confirmado'&&(m.a_id||m.fase==='G')))return i;}return RONDAS.length-1}

function slotTxt(s){if(!s)return'—';let m;if(m=/^([1-4])([A-P])$/.exec(s))return m[1]+'º Zona '+m[2];if(m=/^W:(\d+)$/.exec(s)){const x=S.mby[+m[1]];return 'Ganador '+(x?FASE_N[x.fase]+' '+x.orden:'?')}if(m=/^L:(\d+)$/.exec(s)){const x=S.mby[+m[1]];return 'Perdedor '+(x?FASE_N[x.fase]+' '+x.orden:'?')}return s}
function lado(m,w){const id=m[w+'_id'],p=id&&S.by[id];return p?{p,fl:p.fh,cd:p.codigo,nm:p.nombre,pais:p.pais}:{p:null,fl:'❔',cd:'???',nm:slotTxt(m['slot_'+w])||'Por definir',pais:''}}
function lbl(m){if(m.fase==='G')return 'Zona '+m.grupo+' · Fecha '+m.fecha_n;const c=copaDe(m.copa);return (c?'Copa '+c.k+' · ':'')+FASE_N[m.fase]+(['T3','F'].includes(m.fase)?'':' '+m.orden)}
function fechaTxt(m){if(!m.fecha)return 'Fecha a coordinar';const d=new Date(m.fecha);const dias=['dom.','lun.','mar.','mié.','jue.','vie.','sáb.'];return dias[d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' - '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function modo(){return (S.cfg&&S.cfg.modo)==='golpes'?'golpes':'hoyos'}
function resTxt(m){if(m.estado!=='confirmado'&&m.estado!=='cargado')return'';if(m.a_score!=null&&m.b_score!=null)return m.a_score+' – '+m.b_score;if(m.empate)return 'Empate';const w=S.by[m.ganador_id];return (w?w.codigo:'?')+' gana '+m.margen+' UP'}
function abierto(m){return m.estado==='pendiente'&&!m.cerrado&&m.a_id&&m.b_id&&!(m.fecha&&new Date()>=new Date(m.fecha))}
function soyDe(m){return S.ses&&S.ses.id&&(m.a_id===S.ses.id||m.b_id===S.ses.id)}
function rival(m){return S.by[m.a_id===S.ses.id?m.b_id:m.a_id]}
function pickRes(m){return m.empate?'E':(m.ganador_id===m.a_id?'A':'B')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2600)}

function tabla(g){
  const ps=S.players.filter(p=>p.grupo===g),ms=S.matches.filter(m=>m.fase==='G'&&m.grupo===g);
  const st={};ps.forEach(p=>st[p.id]={p,pj:0,pg:0,pe:0,pp:0,dif:0,pts:0,h2h:0});
  const conf=ms.filter(m=>m.estado==='confirmado');
  conf.forEach(m=>{const a=st[m.a_id],b=st[m.b_id];if(!a||!b)return;a.pj++;b.pj++;
    if(m.empate){a.pe++;b.pe++;a.pts++;b.pts++}else{const w=st[m.ganador_id],l=m.ganador_id===m.a_id?b:a;w.pg++;l.pp++;w.pts+=3;w.dif+=m.margen;l.dif-=m.margen}});
  conf.forEach(m=>{const a=st[m.a_id],b=st[m.b_id];if(!a||!b||a.pts!==b.pts||a.dif!==b.dif)return;   // enfrentamiento directo entre los igualados
    if(m.empate){a.h2h++;b.h2h++}else if(m.ganador_id===m.a_id)a.h2h+=3;else b.h2h+=3});
  let l=Object.values(st).sort((x,y)=>y.pts-x.pts||y.dif-x.dif||y.h2h-x.h2h||x.p.id-y.p.id);
  const ov=S.cfg.desempate&&S.cfg.desempate[g];const completo=ms.length===6&&ms.every(m=>m.estado==='confirmado');
  if(ov&&completo)l=ov.map(id=>st[id]).filter(Boolean);
  return {l,completo,jugados:conf.length,manual:!!(ov&&completo)};
}
function copaFinal(l){
  const ms=S.matches.filter(m=>m.copa===l),g=f=>ms.filter(m=>m.fase===f),out={};
  const gan=m=>m&&m.estado==='confirmado'&&!m.empate?m.ganador_id:null,per=m=>{const w=gan(m);return w?(w===m.a_id?m.b_id:m.a_id):null};
  out[1]=gan(g('F')[0]);out[2]=per(g('F')[0]);out[3]=gan(g('T3')[0]);out[4]=per(g('T3')[0]);
  const dif={};ms.filter(m=>['R16','QF'].includes(m.fase)&&m.estado==='confirmado'&&!m.empate).forEach(m=>{const w=m.ganador_id,x=w===m.a_id?m.b_id:m.a_id;dif[w]=(dif[w]||0)+m.margen;dif[x]=(dif[x]||0)-m.margen});
  if(g('QF').length&&g('QF').every(m=>m.estado==='confirmado')){const o=g('QF').map(per).filter(Boolean).sort((a,b)=>(dif[b]||0)-(dif[a]||0)||a-b);o.forEach((id,i)=>out[5+i]=id)}
  return out;
}

function puestosCopa(l){
  const out=copaFinal(l),ms=S.matches.filter(m=>m.copa===l&&m.fase==='R16');
  if(ms.length&&ms.every(m=>m.estado==='confirmado'&&!m.empate)){   // 9º a 16º: perdedores de octavos
    const zona=id=>{const q=S.by[id],r=q&&q.grupo?tabla(q.grupo).l.find(x=>x.p.id===id):null;return r||{pts:0,dif:0}};
    const lo=ms.map(m=>({id:m.ganador_id===m.a_id?m.b_id:m.a_id,mg:m.margen||0})).filter(x=>x.id);
    lo.sort((a,b)=>a.mg-b.mg||zona(b.id).pts-zona(a.id).pts||zona(b.id).dif-zona(a.id).dif||a.id-b.id).forEach((x,i)=>out[9+i]=x.id)}
  return out}
function detallePuesto(n){return n===1?'Campeón':n===2?'Subcampeón':n===3?'3º puesto':n===4?'4º puesto':n<=8?'Cayó en cuartos':'Cayó en octavos'}
function finalFilas(){const f=[];COPAS.forEach((c,ci)=>{const o=puestosCopa(c.l);for(let n=1;n<=16;n++)f.push({g:ci*16+n,n,c,id:o[n]||null})});return f}
function copiarFinal(){const t=finalFilas().filter(r=>r.id).map(r=>r.g+'º  '+S.by[r.id].nombre+' ('+S.by[r.id].pais+') · Copa '+r.c.k+' · '+detallePuesto(r.n)).join('\n');navigator.clipboard.writeText('MUNDIALITO MATCH PLAY ELITE 2026 · Posiciones finales\n\n'+t).then(()=>toast('Copiado'))}
function vFinal(){
  const f=finalFilas(),def=f.filter(r=>r.id).length;
  return `<div class="msg" style="margin:8px 12px">Posiciones finales del <b>1º al 64º</b>: cada copa ocupa 16 lugares (💎 1-16 · 🏆 17-32 · 🥈 33-48 · 🥉 49-64). Definidas: <b>${def}</b> de 64. <button class="btn sm gris" onclick="copiarFinal()" style="margin-left:6px">📋 Copiar</button></div>`+
  COPAS.map((c,ci)=>`<div class="card" style="padding:0;overflow:hidden"><div style="background:${c.bg};color:#fff;padding:10px 14px"><b>${c.i} COPA ${c.k.toUpperCase()}</b> <span style="font-size:12px;opacity:.9">· puestos ${ci*16+1} a ${ci*16+16}</span></div><table class="pos">${f.filter(r=>r.c===c).map(r=>{const q=r.id&&S.by[r.id];return `<tr><td style="width:40px"><b>${r.g}º</b></td><td class="n">${q?q.fh+' <b>'+esc(q.codigo)+'</b> '+esc(q.nombre)+'<div class="sub2">'+detallePuesto(r.n)+'</div>':'<span class="sub2">a definir</span>'}</td><td style="text-align:right;white-space:nowrap">${r.n<=6?'<b>'+$m(PREMIOS[c.k][r.n-1])+'</b>':''}</td></tr>`}).join('')}</table></div>`).join('')+
  `<div class="sub2" style="margin:6px 16px">Dentro de cada copa: 1º a 4º por final y 3er puesto; 5º a 8º, los perdedores de cuartos por diferencia de hoyos; 9º a 16º, los perdedores de octavos por menor diferencia en su partido y, si igualan, por puntos y diferencia de la zona.</div>`}
function vCopas(){
  const sel=copaDe(S.copaSel)||COPAS[0],fin=copaFinal(sel.l),ms=S.matches.filter(m=>m.copa===sel.l);
  const chips=`<div class="chips">${COPAS.map(c=>`<button class="${c.l===sel.l?'on':''}" onclick="S.copaSel='${c.l}';pintar()">${c.i} ${c.k}</button>`).join('')}</div>`;
  const armada=ms.some(m=>m.a_id);
  const tabla=`<div class="card" style="padding:0;overflow:hidden"><div style="background:${sel.bg};color:#fff;padding:12px 14px"><b style="letter-spacing:.04em">${sel.i} COPA ${sel.k.toUpperCase()}</b><div style="font-size:12px;opacity:.9">${sel.pos} · 16 jugadores · eliminación directa</div></div><table class="pos">${[1,2,3,4,5,6].map(n=>{const p=S.by[fin[n]];return `<tr><td style="width:34px"><b>${n}º</b></td><td class="n">${p?p.fh+' <b>'+esc(p.codigo)+'</b> '+esc(p.nombre):'<span class="sub2">'+(armada?'a definir':'se arma al terminar las 16 zonas')+'</span>'}</td><td style="text-align:right;white-space:nowrap"><b>${$m(PREMIOS[sel.k][n-1])}</b></td></tr>`}).join('')}</table></div><div class="sub2" style="margin:6px 16px">5º y 6º: entre los 4 perdedores de cuartos, por diferencia de hoyos en la copa.</div>`;
  const rondas=[['R16','Octavos de final'],['QF','Cuartos de final'],['SF','Semifinales'],['T3','Tercer puesto'],['F','Final']];
  return chips+tabla+rondas.map(([f,t])=>{const l=ms.filter(m=>m.fase===f).sort((a,b)=>a.id-b.id);return `<div class="card"><div class="meta"><b>${t}</b><span class="sub2">${l.filter(m=>m.estado==='confirmado').length}/${l.length}</span></div>${l.map(filaPartido).join('')}</div>`}).join('');
}
function grupos(){return [...new Set(S.players.map(p=>p.grupo).filter(Boolean))].sort()}
function empateCritico(g){const t=tabla(g);if(!t.completo||t.manual)return false;for(let i=0;i<t.l.length-1;i++){const a=t.l[i],b=t.l[i+1];if(a.pts===b.pts&&a.dif===b.dif&&a.h2h===b.h2h)return true}return false}

function cardBase(m,cuerpo,extra){return `<div class="card"><div class="meta"><span>${esc(fechaTxt(m))}<br><b>${esc(lbl(m))}</b></span><span>${extra||''}</span></div>${cuerpo}</div>`}

function vPron(){

}
function listaPron(ms,ro){
  const pend=ms.filter(m=>m.estado!=='confirmado'),jug=ms.filter(m=>m.estado==='confirmado');
  let h='';if(pend.length)h+='<h2 class="sec">Próximos partidos</h2>'+pend.map(m=>cardPron(m,ro)).join('');
  if(jug.length)h+='<h2 class="sec">Jugados</h2>'+jug.map(m=>cardPron(m,ro)).join('');return h||''}
function cardPron(m,ro){
  const A=lado(m,'a'),Bq=lado(m,'b'),pk=S.picks[m.id],can=!ro&&abierto(m),fin=m.estado==='confirmado',res=fin?pickRes(m):null;
  const blk=(w,l)=>{let c='opt';if(fin&&pk===w)c+=(pk===res?' ok':' mal');else if(pk===w)c+=' on';if(!can)c+=' dis';
    return `<div class="${c}" ${can?`onclick="pick(${m.id},'${w}')"`:''}><span style="font-size:26px">${l.fl}</span><span>${esc(l.cd)}</span></div>`};
  const mid=m.fase==='G'?`<div class="opt ${pk==='E'?(fin?(res==='E'?'ok':'mal'):'on'):''} ${can?'':'dis'}" style="flex:.7" ${can?`onclick="pick(${m.id},'E')"`:''}><span style="font-size:20px">＝</span><small>Empate</small></div>`:'';
  const nota=fin?`<div class="sub2" style="text-align:center;margin-top:8px">${esc(resTxt(m))}${pk?(pk===res?` · <b style="color:var(--ok)">+${PTS[m.fase]} pts</b>`:' · <b style="color:var(--mal)">0 pts</b>'):' · sin pronóstico'}</div>`:
    (!can&&!ro&&m.a_id&&m.b_id?`<div class="sub2" style="text-align:center;margin-top:8px">🔒 Pronósticos cerrados${pk?'':' · no pronosticaste'}</div>`:'');
  const extra=fin?'<span class="tag ok">Final</span>':(m.estado==='cargado'?'<span class="tag warn">Por confirmar</span>':(can?'':'🔒'));
  return cardBase(m,`<div class="pr"><div class="side"><span class="fl">${A.fl}</span><span class="cd">${esc(A.cd)}</span><span class="nm">${esc(A.nm)}</span></div>${'<div style="width:6px"></div>'}<div style="display:flex;gap:6px;flex:2.2">${blk('A',A)}${mid}${blk('B',Bq)}</div><div class="side"><span class="fl">${Bq.fl}</span><span class="cd">${esc(Bq.cd)}</span><span class="nm">${esc(Bq.nm)}</span></div></div>${nota}`,extra);
}
async function pick(mid,w){
  const m=S.mby[mid];if(!abierto(m)){toast('Pronósticos cerrados');return}
  const ant=S.picks[mid];S.picks[mid]=w;pintar();
  try{const r=await rpc('mm_set_pick',{p_player:S.ses.id,p_pin:S.ses.pin,p_match:mid,p_pick:w});if(!r.ok){if(ant)S.picks[mid]=ant;else delete S.picks[mid];toast(r.error||'No se pudo guardar');await cargar(true)}else toast('✔ Guardado')}
  catch(e){if(ant)S.picks[mid]=ant;else delete S.picks[mid];pintar();toast('Sin conexión: no se guardó')}
}

function detalle(id){
  const m=S.mby[id],A=lado(m,'a'),Bq=lado(m,'b');let h=`<button class="x" onclick="cerrar()">✕</button><h3>${esc(lbl(m))}</h3><div class="sub2">${esc(fechaTxt(m))}</div>

    if(m.estado==='cargado'&&m.cargado_por!==S.ses.id)h+=`<div class="row"><button class="btn" style="flex:1" onclick="conf(${id},true)">✔ Confirmar</button><button class="btn gris" style="flex:1" onclick="conf(${id},false)">No estoy de acuerdo</button></div>`;

    $('pkd').innerHTML=`🎯 Pronósticos (${t}): <b>${A.cd} ${pc(c.A)}</b>${m.fase==='G'?` · Empate ${pc(c.E)}`:''} · <b>${Bq.cd} ${pc(c.B)}</b>`}).catch(()=>{});
}

function haceTxt(t){if(!t)return'';const s=Math.max(0,(Date.now()-new Date(t))/1000);return s<60?'recién':s<3600?'hace '+Math.floor(s/60)+' min':'hace '+Math.floor(s/3600)+' h'}
function vVivo(){
  const ri=rondaActual(),r=RONDAS[ri],ms=delRonda(r).filter(m=>m.a_id&&m.b_id),tot=ms.length;
  const fin=ms.filter(m=>m.estado==='confirmado'),xc=ms.filter(m=>['cargado','disputado'].includes(m.estado)),fal=ms.filter(m=>m.estado==='pendiente');

  let h=`<div class="hero" style="margin-top:12px"><div class="big" style="font-size:20px"><span style="color:#ff4d4d">●</span> EN VIVO · ${esc(r.t)}</div><div class="sub">Se anota por ${g?'golpes (gana el que tiene menos)':'hoyos ganados (gana el que tiene más)'} · se actualiza solo</div>
   <div style="background:rgba(255,255,255,.25);border-radius:99px;height:10px;margin-top:12px;overflow:hidden"><div style="width:${pc}%;height:100%;background:#fff"></div></div>
   <div class="kpis"><div><b>${fin.length}</b><span>terminados</span></div><div><b>${xc.length}</b><span>por confirmar</span></div><div><b>${fal.length}</b><span>sin terminar</span></div></div></div>`;
  const yo=S.ses&&S.ses.id&&S.by[S.ses.id];

/* ---- sorteo en vivo cargado a mano: 16 zonas x 4 lugares. El orden de los lugares define los cruces (1-2, 3-4 / 1-3, 2-4 / 1-4, 2-3) ---- */
function manGet(){let m=null;try{m=JSON.parse(localStorage.getItem('mm_man')||'null')}catch(e){}
  if(!Array.isArray(m)||m.length!==16||m.some(z=>!Array.isArray(z)||z.length!==4)){m=[...Array(16)].map(()=>[0,0,0,0]);
    // si ya hay sorteo guardado, partir de ese
    S.players.forEach(p=>{if(p.grupo&&p.pos)m[p.grupo.charCodeAt(0)-65][p.pos-1]=p.id})}
  return m}
function manSet(m){window._man=m;try{localStorage.setItem('mm_man',JSON.stringify(m))}catch(e){}}
function cargarSorteo(){manSet(manGet());manPintar()}
function manElegir(z,i,v){const m=window._man;m[z][i]=+v||0;manSet(m);manPintar()}
function manLimpiar(){if(!confirm('¿Borrar lo cargado hasta ahora?'))return;manSet([...Array(16)].map(()=>[0,0,0,0]));manPintar()}
function manPintar(){
  const m=window._man,usados=new Set(m.flat().filter(Boolean)),lista=S.players.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)),falta=64-usados.size;
  const opts=(sel)=>`<option value="0">— elegir —</option>`+lista.map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''} ${usados.has(p.id)&&p.id!==sel?'disabled':''}>${esc(p.bandera)} ${esc(p.nombre)} (${esc(p.codigo)})</option>`).join('');
  $('srt').innerHTML=`<div class="sub2" style="margin:8px 0">Cargá cada zona en el orden en que salió. Lo que cargás se guarda en este celular/compu aunque cierres la app. Los ya elegidos aparecen deshabilitados.</div>
  <div class="msg" style="margin:6px 0">Cargados: <b>${usados.size}</b> de 64${falta?` · faltan ${falta}`:' · ¡completo!'}</div>`+
  m.map((z,gi)=>{const L=String.fromCharCode(65+gi),n=z.filter(Boolean).length;return `<div class="card" style="margin:6px 0"><b>ZONA ${L}</b> <span class="sub2">${n}/4</span>${z.map((v,i)=>`<select class="in" style="margin-top:4px" onchange="manElegir(${gi},${i},this.value)">${opts(v)}</select>`).join('')}</div>`}).join('')+
  `<div class="row" style="margin:10px 0"><button class="btn sm" ${falta?'disabled':''} onclick="manGuardar()">✔ Guardar sorteo (arma los 96 partidos)</button><button class="btn sm gris" onclick="manLimpiar()">Borrar todo</button></div>`}
async function manGuardar(){const m=window._man,ids=m.flat();
  if(ids.some(v=>!v)||new Set(ids).size!==64){alert('Tienen que estar los 64 jugadores, cada uno una sola vez');return}
  if(!confirm('Se arman los 96 partidos de grupos con este sorteo. ¿Confirmás?'))return;
  const asig=[];m.forEach((z,gi)=>z.forEach((id,i)=>asig.push({player:id,grupo:String.fromCharCode(65+gi),pos:i+1})));
  const r=await rpc('mm_admin_sorteo',{p_apin:S.admin,p_asig:asig});if(!r.ok){alert(r.error);return}
  try{localStorage.removeItem('mm_man')}catch(e){}toast('✔ Sorteo guardado');await cargar(true)}
function azar(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function mezclar(l){l=l.slice();for(let i=l.length-1;i>0;i--){const j=azar(i+1);[l[i],l[j]]=[l[j],l[i]]}return l}
function sortear(){
  const conts=['Europa','América','África','Asia','Oceanía'];let k=azar(16),asig=[];const G=[...Array(16)].map(()=>[]);
  conts.forEach(c=>mezclar(S.players.filter(p=>p.continente===c)).forEach(p=>{G[k%16].push(p);k++}));
  G.forEach((l,gi)=>mezclar(l).forEach((p,i)=>asig.push({player:p.id,grupo:String.fromCharCode(65+gi),pos:i+1})));
  window._asig=asig;
  $('srt').innerHTML=`<div class="sub2" style="margin:8px 0">Vista previa del sorteo:</div>`+G.map((l,gi)=>`<div style="margin:4px 0"><b>${String.fromCharCode(65+gi)}</b> ${asig.filter(a=>a.grupo===String.fromCharCode(65+gi)).map(a=>S.by[a.player].fh+' '+S.by[a.player].codigo).join(' · ')}</div>`).join('')+`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="guardarSorteo()">✔ Confirmar y guardar</button><button class="btn sm gris" onclick="sortear()">Otro sorteo</button></div>`;
}
async function guardarSorteo(){if(!confirm('Se arman los 96 partidos de grupos con este sorteo. ¿Confirmás?'))return;const r=await rpc('mm_admin_sorteo',{p_apin:S.admin,p_asig:window._asig});if(!r.ok){alert(r.error);return}toast('✔ Sorteo guardado');await cargar(true)}
async function genPins(todos){if(todos&&!confirm('Esto INVALIDA los PIN actuales de todos. ¿Seguro?'))return;const r=await rpc('mm_admin_pins',{p_apin:S.admin,p_todos:todos});if(!r.ok){alert(r.error);return}
  window._pins=r.pins;const url=location.href.split('#')[0].split('?')[0];
  $('pins').innerHTML=r.pins.length?`<div class="row" style="margin:8px 0"><button class="btn sm" onclick="copiarPins()">📋 Copiar todos</button><button class="btn sm gris" onclick="csvPins()">⬇ Excel (CSV)</button></div>`+r.pins.map(x=>`<div class="row sb" style="border-top:1px solid var(--bd);padding:6px 0"><span>${(S.by[x.id]||{}).fh||''} ${esc(x.nombre)}</span><span><b style="letter-spacing:.15em">${x.pin}</b> <a class="btn sm gris" style="text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(msgPin(x,url))}">WhatsApp</a></span></div>`).join(''):'<div class="sub2">Todos ya tienen PIN.</div>'}
async function reemplazar(){const id=+$('rpj').value,o=S.by[id],n=$('rpn').value.trim(),pa=$('rpp').value.trim(),c=$('rpc').value.trim().toUpperCase(),b=$('rpb').value.trim(),k=$('rpk').value;

  if(!confirm('Sale '+o.nombre+' ('+o.pais+') y entra '+n+' ('+pa+') en su lugar. ¿Confirmás?'))return;

  const url=location.href.split('#')[0].split('?')[0],x={nombre:n,pais:pa,pin:r.pin};window._pins=[x];toast('✔ Reemplazo hecho');await cargar(true);
  const e=$('rpout');if(e)e.innerHTML=`<div class="msg" style="margin-top:8px">Entra <b>${esc(n)}</b>. PIN: <b style="letter-spacing:.15em">${r.pin}</b> (se muestra una sola vez) <a class="btn sm gris" style="text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(msgPin(x,url))}">WhatsApp</a></div>`}

  if(!n||!pa||c.length!==3||!b){alert('Completá nombre, país, código de 3 letras y bandera (podés usar "Traer datos actuales" y cambiar lo que haga falta)');return}
  if(!confirm('Se corrige '+o.nombre+' ('+o.pais+') → '+n+' ('+pa+'). Conserva PIN, pronósticos, zona y partidos. ¿Confirmás?'))return;

  $('lgback').onclick=()=>{$('lg2').classList.add('hide');$('lg1').classList.remove('hide')};
  $('lgesp').onclick=()=>{S.ses={id:null};localStorage.setItem('mm_ses',JSON.stringify(S.ses));entrar()};
  const ir=async()=>{const pin=$('lgpin').value.trim();if(pin.length<4){$('lgerr').textContent='Poné los 4 dígitos';return}$('lgerr').textContent='Verificando…';
    try{const r=await rpc('mm_login',{p_player:_lg.id,p_pin:pin});if(!r.ok){$('lgerr').textContent=r.error;return}S.ses={id:_lg.id,pin};localStorage.setItem('mm_ses',JSON.stringify(S.ses));entrar()}catch(e){$('lgerr').textContent='Sin conexión'}};
  $('lgok').onclick=ir;$('lgpin').onkeydown=e=>{if(e.key==='Enter')ir()};
}
function entrar(){$('login').classList.add('hide');$('app').classList.remove('hide');$('nav').classList.remove('hide');pintar()}

/* ========================= atras nunca saca de la app + deslizar hacia abajo para actualizar ========================= */
(function(){
  try{history.replaceState({mm:0},'');history.pushState({mm:1},'')}catch(e){}
  addEventListener('popstate',()=>{
    const sh=$('sheet');
    if(sh&&!sh.classList.contains('hide'))cerrar();
    else if($('lg2')&&!$('lg2').classList.contains('hide')){$('lg2').classList.add('hide');$('lg1').classList.remove('hide')}
    else if($('app')&&!$('app').classList.contains('hide')&&S.tab!=='torneo'){S.tab='torneo';pintar();window.scrollTo(0,0)}
    else window.scrollTo(0,0);
    try{history.pushState({mm:1},'')}catch(e){}   // siempre queda un paso "de reserva": volver atras jamas cierra la app
  });
  const ind=document.createElement('div');ind.id='ptr';ind.textContent='↓ Deslizá para actualizar';document.body.appendChild(ind);
  let y0=0,dy=0,act=false,busy=false;
  const sheetAbierto=()=>{const sh=$('sheet');return sh&&!sh.classList.contains('hide')};
  const fin=()=>{ind.classList.remove('mov');ind.style.transform='';ind.textContent='↓ Deslizá para actualizar'};
  addEventListener('touchstart',e=>{act=!busy&&e.touches.length===1&&(window.scrollY||document.documentElement.scrollTop)<=0&&!sheetAbierto();if(act){y0=e.touches[0].clientY;dy=0}},{passive:true});
  addEventListener('touchmove',e=>{if(!act)return;dy=e.touches[0].clientY-y0;
    if(dy>4&&(window.scrollY||0)<=0){ind.classList.add('mov');ind.style.transform='translateY('+(Math.min(dy,110)*.6-70)+'px)';ind.textContent=dy>80?'↑ Soltá para actualizar':'↓ Deslizá para actualizar'}
    else if(dy<=0){fin()}},{passive:true});
  addEventListener('touchend',async()=>{if(!act)return;act=false;const ir=dy>80;dy=0;
    if(!ir){fin();return}
    busy=true;ind.classList.remove('mov');ind.textContent='Actualizando…';ind.style.transform='translateY(-10px)';
    try{await cargar(true)}catch(e){}
    ind.textContent=S.err?'Sin conexión':'✔ Actualizado';await new Promise(r=>setTimeout(r,700));fin();busy=false},{passive:true});
  addEventListener('touchcancel',()=>{act=false;fin()},{passive:true});
})();

/* ========================= arranque ========================= */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
(async function(){
  try{S.ses=JSON.parse(localStorage.getItem('mm_ses')||'null')}catch(e){}
  S.admin=sessionStorage.getItem('mm_adm')||null;
  if(new URLSearchParams(location.search).get('tab'))S.tab=new URLSearchParams(location.search).get('tab');
  await cargar();
  if(!S.cargado){$('login').classList.remove('hide');$('lg1').innerHTML='<div class="err" style="margin-top:30px">'+esc(S.err)+'</div><div class="lk" onclick="location.reload()">Reintentar</div>';return}
  if(S.ses&&S.ses.id){const r=await rpc('mm_login',{p_player:S.ses.id,p_pin:S.ses.pin}).catch(()=>({ok:true}));if(!r.ok){S.ses=null;localStorage.removeItem('mm_ses')}}
  if(S.ses)entrar();else loginUI();
  (function tick(){const ms=(S.tab==='vivo'?12000:25000)+Math.random()*5000;setTimeout(()=>{if(!document.hidden&&S.ses){S._n=(S._n||0)+1;cargar(true,S._n%6!==0).finally(tick)}else tick()},ms)})();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ses)cargar(true)});
})();
/* service worker: avisa y recarga cuando hay versión nueva */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const avisar=w=>{if($('upd'))return;const d=document.createElement('div');d.id='upd';d.textContent='🔄 Hay una versión nueva — tocá para actualizar';d.onclick=()=>w.postMessage({type:'SKIP_WAITING'});document.body.appendChild(d)};
    if(reg.waiting&&navigator.serviceWorker.controller)avisar(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)avisar(w)})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
}
</script></body></html>
