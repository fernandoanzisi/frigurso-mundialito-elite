<style>

#login .pl button:last-child{border-bottom:0}#login .pl small{color:#7f8fb0;margin-left:auto}
#login input{width:100%;border:1px solid #1e2b47;border-radius:10px;padding:12px;background:#0e1626;color:#fff;font-size:16px}

/* IDENTIDAD FRIGURSO: splash (puro CSS, se va solo) */
#fg-splash{position:fixed;inset:0;z-index:9000;background:#0b1220;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;animation:fg-splash-out .6s ease 2.4s forwards}
.fg-sash{position:absolute;width:130vw;height:22vh;max-height:170px;background:linear-gradient(90deg,#d7263d 0%,#d7263d 92%,#5fb0e8 100%);transform:rotate(-22deg) translateX(-140vw);top:46%;left:0;margin-top:-11vh;box-shadow:0 0 60px rgba(215,38,61,.3);animation:fg-sash-sweep 1.3s cubic-bezier(.16,.8,.24,1) both}
@keyframes fg-sash-sweep{0%{transform:rotate(-22deg) translateX(-140vw)}55%{transform:rotate(-22deg) translateX(0)}100%{transform:rotate(-22deg) translateX(0)}}

@keyframes fg-word-in{to{opacity:1;transform:translateY(0)}}

@media (prefers-reduced-motion:reduce){.fg-sash{animation:none;transform:rotate(-22deg) translateX(0)}.fg-wordmark,.fg-tagline{animation:none;opacity:1;transform:none}#fg-splash{animation-delay:.1s}}

<script>
'use strict';
/* ========================= configuración ========================= */
const CFG = window.MM_CFG || {URL:'__SB_URL__', KEY:'__SB_KEY__'};
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = {players:[],by:{},matches:[],mby:{},cfg:{},picks:{},rank:[],ses:null,admin:null,tab:'torneo',ri:0,riSet:false,posTab:'grupos',grp:'*',fil:'todos',cargado:false,err:'',perfil:null};
const RONDAS = [
 {k:'G1',fase:['G'],n:1,t:'Fase de grupos · Fecha 1'},{k:'G2',fase:['G'],n:2,t:'Fase de grupos · Fecha 2'},{k:'G3',fase:['G'],n:3,t:'Fase de grupos · Fecha 3'},
 {k:'R32',fase:['R32'],t:'16avos de final'},{k:'R16',fase:['R16'],t:'Octavos de final'},{k:'QF',fase:['QF'],t:'Cuartos de final'},{k:'SF',fase:['SF'],t:'Semifinales'},{k:'F',fase:['T3','F'],t:'Final y 3er puesto'}];
const FASE_N = {G:'Grupos',R32:'16avos',R16:'Octavos',QF:'Cuartos',SF:'Semifinal',T3:'3er puesto',F:'Final'};
const PTS = {G:1,R32:2,R16:3,QF:4,SF:5,T3:3,F:6};
const rondaDe = m => RONDAS.find(r=>r.fase.includes(m.fase) && (m.fase!=='G'||r.n===m.fecha_n));
const delRonda = r => S.matches.filter(m=>r.fase.includes(m.fase) && (r.n==null||m.fecha_n===r.n)).sort((a,b)=>a.id-b.id);

/* ========================= red ========================= */
const HD = ()=>({apikey:CFG.KEY,Authorization:'Bearer '+CFG.KEY});
async function rest(t,qs){const r=await fetch(`${CFG.URL}/rest/v1/${t}?${qs||'select=*'}`,{headers:HD()});if(!r.ok)throw new Error('Error '+r.status);return r.json()}
async function rpc(fn,args){const r=await fetch(`${CFG.URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},HD()),body:JSON.stringify(args||{})});if(!r.ok)throw new Error('Error '+r.status);return r.json()}

/* ========================= datos ========================= */
async function cargar(silencio){
  try{
    const [pl,ma,cf]=await Promise.all([rest('mm_players','select=*&order=id'),rest('mm_matches','select=*&order=id'),rest('mm_config','select=*')]);
    S.players=pl;S.by={};pl.forEach(p=>S.by[p.id]=p);S.matches=ma;S.mby={};ma.forEach(m=>S.mby[m.id]=m);
    S.cfg={};cf.forEach(c=>S.cfg[c.clave]=c.valor);
    S.rank=await rpc('mm_ranking');
    if(S.ses&&S.ses.id){const r=await rpc('mm_mis_picks',{p_player:S.ses.id,p_pin:S.ses.pin});if(r.ok)S.picks=r.picks;}
    S.cargado=true;S.err='';
    if(!S.riSet){S.ri=rondaActual();S.riSet=true;}
  }catch(e){S.err='Sin conexión con el servidor. Mostrando lo último que se vio.';if(!silencio&&!S.cargado)S.err='No pude conectarme al servidor. Revisá tu internet.';}
  pintar();
}
function rondaActual(){for(let i=0;i<RONDAS.length;i++){const l=delRonda(RONDAS[i]);if(l.some(m=>m.estado!=='confirmado'&&(m.a_id||m.fase==='G')))return i;}return RONDAS.length-1}

/* ========================= utilidades de partido ========================= */
function slotTxt(s){if(!s)return'—';let m;if(m=/^([12])([A-P])$/.exec(s))return m[1]+'º Grupo '+m[2];if(m=/^W:(\d+)$/.exec(s)){const x=S.mby[+m[1]];return 'Ganador '+(x?FASE_N[x.fase]+' '+x.orden:'?')}if(m=/^L:(\d+)$/.exec(s)){const x=S.mby[+m[1]];return 'Perdedor '+(x?FASE_N[x.fase]+' '+x.orden:'?')}return s}
function lado(m,w){const id=m[w+'_id'],p=id&&S.by[id];return p?{p,fl:p.bandera,cd:p.codigo,nm:p.nombre,pais:p.pais}:{p:null,fl:'❔',cd:'???',nm:slotTxt(m['slot_'+w])||'Por definir',pais:''}}
function lbl(m){if(m.fase==='G')return 'Grupo '+m.grupo+' · Fecha '+m.fecha_n;return FASE_N[m.fase]+(['T3','F'].includes(m.fase)?'':' '+m.orden)}
function fechaTxt(m){if(!m.fecha)return 'Fecha a coordinar';const d=new Date(m.fecha);const dias=['dom.','lun.','mar.','mié.','jue.','vie.','sáb.'];return dias[d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' - '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function resTxt(m){if(m.estado!=='confirmado'&&m.estado!=='cargado')return'';if(m.empate)return 'Empate';const w=S.by[m.ganador_id];return (w?w.codigo:'?')+' gana '+m.margen+' UP'}
function abierto(m){return m.estado==='pendiente'&&!m.cerrado&&m.a_id&&m.b_id&&!(m.fecha&&new Date()>=new Date(m.fecha))}
function soyDe(m){return S.ses&&S.ses.id&&(m.a_id===S.ses.id||m.b_id===S.ses.id)}
function rival(m){return S.by[m.a_id===S.ses.id?m.b_id:m.a_id]}
function pickRes(m){return m.empate?'E':(m.ganador_id===m.a_id?'A':'B')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.add('hide'),2600)}

/* ========================= posiciones ========================= */
function tabla(g){
  const ps=S.players.filter(p=>p.grupo===g),ms=S.matches.filter(m=>m.fase==='G'&&m.grupo===g);
  const st={};ps.forEach(p=>st[p.id]={p,pj:0,pg:0,pe:0,pp:0,dif:0,pts:0});
  ms.filter(m=>m.estado==='confirmado').forEach(m=>{const a=st[m.a_id],b=st[m.b_id];if(!a||!b)return;a.pj++;b.pj++;
    if(m.empate){a.pe++;b.pe++;a.pts++;b.pts++}else{const w=st[m.ganador_id],l=m.ganador_id===m.a_id?b:a;w.pg++;l.pp++;w.pts+=3;w.dif+=m.margen;l.dif-=m.margen}});
  let l=Object.values(st).sort((x,y)=>y.pts-x.pts||y.dif-x.dif||y.pg-x.pg||x.p.id-y.p.id);
  const ov=S.cfg.desempate&&S.cfg.desempate[g];const completo=ms.length===6&&ms.every(m=>m.estado==='confirmado');
  if(ov&&completo)l=ov.map(id=>st[id]).filter(Boolean);
  return {l,completo,jugados:ms.filter(m=>m.estado==='confirmado').length};
}
function grupos(){return [...new Set(S.players.map(p=>p.grupo).filter(Boolean))].sort()}
function empateCritico(g){const t=tabla(g);if(!t.completo)return false;const a=t.l[1],b=t.l[2];return a&&b&&a.pts===b.pts&&a.dif===b.dif&&a.pg===b.pg}

/* ========================= pantallas ========================= */
function pintar(){
  if(!S.cargado){$('main').innerHTML='<div class="msg">Cargando…</div>';return}
  $('yo').textContent=S.ses?(S.ses.id?(S.by[S.ses.id]?S.by[S.ses.id].bandera+' '+S.by[S.ses.id].nombre.split(' ')[0]:'Yo'):'👀 Espectador'):'';
  $('msgbar').innerHTML=S.err?`<div class="msg bad">${esc(S.err)}</div>`:'';
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===S.tab));
  const f={torneo:vTorneo,pos:vPos,pron:vPron,fix:vFix,mas:vMas}[S.tab];$('main').innerHTML=f();
}
function go(t){S.tab=t;pintar();window.scrollTo(0,0)}

function listaPron(ms,ro){
  const pend=ms.filter(m=>m.estado!=='confirmado'),jug=ms.filter(m=>m.estado==='confirmado');

function cardPron(m,ro){

  const blk=(w,l)=>{let c='opt';if(fin&&pk===w)c+=(pk===res?' ok':' mal');else if(pk===w)c+=' on';if(!can)c+=' dis';
    return `<div class="${c}" ${can?`onclick="pick(${m.id},'${w}')"`:''}><span style="font-size:26px">${l.fl}</span><span>${esc(l.cd)}</span></div>`};
  const mid=m.fase==='G'?`<div class="opt ${pk==='E'?(fin?(res==='E'?'ok':'mal'):'on'):''} ${can?'':'dis'}" style="flex:.7" ${can?`onclick="pick(${m.id},'E')"`:''}><span style="font-size:20px">＝</span><small>Empate</small></div>`:'';
  const nota=fin?`<div class="sub2" style="text-align:center;margin-top:8px">${esc(resTxt(m))}${pk?(pk===res?` · <b style="color:var(--ok)">+${PTS[m.fase]} pts</b>`:' · <b style="color:var(--mal)">0 pts</b>'):' · sin pronóstico'}</div>`:
    (!can&&!ro&&m.a_id&&m.b_id?`<div class="sub2" style="text-align:center;margin-top:8px">🔒 Pronósticos cerrados${pk?'':' · no pronosticaste'}</div>`:'');
  const extra=fin?'<span class="tag ok">Final</span>':(m.estado==='cargado'?'<span class="tag warn">Por confirmar</span>':(can?'':'🔒'));
  return cardBase(m,`<div class="pr"><div class="side"><span class="fl">${A.fl}</span><span class="cd">${esc(A.cd)}</span><span class="nm">${esc(A.nm)}</span></div>${'<div style="width:6px"></div>'}<div style="display:flex;gap:6px;flex:2.2">${blk('A',A)}${mid}${blk('B',Bq)}</div><div class="side"><span class="fl">${Bq.fl}</span><span class="cd">${esc(Bq.cd)}</span><span class="nm">${esc(Bq.nm)}</span></div></div>${nota}`,extra);
}
async function pick(mid,w){

  catch(e){if(ant)S.picks[mid]=ant;else delete S.picks[mid];pintar();toast('Sin conexión: no se guardó')}

function detalle(id){
  const m=S.mby[id],A=lado(m,'a'),Bq=lado(m,'b');let h=`<button class="x" onclick="cerrar()">✕</button><h3>${esc(lbl(m))}</h3><div class="sub2">${esc(fechaTxt(m))}</div>

    if(m.estado==='cargado'&&m.cargado_por!==S.ses.id)h+=`<div class="row"><button class="btn" style="flex:1" onclick="conf(${id},true)">✔ Confirmar</button><button class="btn gris" style="flex:1" onclick="conf(${id},false)">No estoy de acuerdo</button></div>`;
  }
  if(S.admin){h+=`<div class="sub2" style="margin-top:14px">ORGANIZACIÓN</div><div class="row">${m.a_id&&m.b_id?`<button class="btn sm sec" onclick="formRes(${id},true)">Cargar / corregir</button>`:''}${m.estado!=='pendiente'?`<button class="btn sm gris" onclick="anular(${id})">Anular resultado</button>`:''}</div>`}
  h+=`<div id="pkd" class="sub2" style="margin-top:12px"></div>`;
  abrirSheet(h);

    $('pkd').innerHTML=`🎯 Pronósticos (${t}): <b>${A.cd} ${pc(c.A)}</b>${m.fase==='G'?` · Empate ${pc(c.E)}`:''} · <b>${Bq.cd} ${pc(c.B)}</b>`}).catch(()=>{});
}

  <details style="margin-top:10px"><summary><b>2. PINs de los jugadores</b></summary><div class="sub2" style="margin:6px 0">Cada jugador entra con su nombre y un PIN de 4 dígitos. Se muestran UNA sola vez: copialos y mandalos por WhatsApp.</div>
   <div class="row"><button class="btn sm" onclick="genPins(false)">Generar los que faltan</button><button class="btn sm gris" onclick="genPins(true)">Regenerar TODOS</button></div><div id="pins"></div></details>
  <details style="margin-top:10px"><summary><b>3. Resultados por resolver</b> <span class="tag ${resolver.length?'warn':''}">${resolver.length}</span></summary>${resolver.length?resolver.map(m=>`<div style="margin:6px 0">${filaPartido(m)}</div>`).join(''):'<div class="sub2">No hay nada pendiente.</div>'}</details>
  <details style="margin-top:10px"><summary><b>4. Fechas y cierre de pronósticos</b></summary>
   <label class="l">Ronda</label><select class="in" id="afr">${RONDAS.map((r,i)=>`<option value="${i}" ${i===S.ri?'selected':''}>${esc(r.t)}</option>`).join('')}</select>
   <label class="l">Fecha y hora de los partidos de esa ronda</label><input class="in" type="datetime-local" id="afd">
   <div class="row" style="margin-top:8px"><button class="btn sm" onclick="adFecha()">Guardar fecha</button><button class="btn sm gris" onclick="adCerrar(true)">🔒 Cerrar pronósticos</button><button class="btn sm gris" onclick="adCerrar(false)">🔓 Abrir</button></div></details>
  <details style="margin-top:10px"><summary><b>5. Desempates</b> <span class="tag ${crit.length?'warn':''}">${crit.length}</span></summary>${crit.length?crit.map(g=>{const t=tabla(g);return `<div style="margin:8px 0"><b>Grupo ${g}</b> <span class="sub2">empatan 2º y 3º</span><div class="row">${[0,1,2,3].map(i=>`<select class="in" style="width:auto" id="dq${g}${i}">${t.l.map(r=>`<option value="${r.p.id}" ${r.p.id===t.l[i].p.id?'selected':''}>${i+1}º ${esc(r.p.codigo)}</option>`).join('')}</select>`).join('')}<button class="btn sm" onclick="adDes('${g}')">Fijar</button></div></div>`}).join(''):'<div class="sub2">No hay empates que resolver.</div>'}</details>`;
}
function azar(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function mezclar(l){l=l.slice();for(let i=l.length-1;i>0;i--){const j=azar(i+1);[l[i],l[j]]=[l[j],l[i]]}return l}
function sortear(){
  const conts=['Europa','América','África','Asia','Oceanía'];let k=azar(16),asig=[];const G=[...Array(16)].map(()=>[]);
  conts.forEach(c=>mezclar(S.players.filter(p=>p.continente===c)).forEach(p=>{G[k%16].push(p);k++}));
  G.forEach((l,gi)=>mezclar(l).forEach((p,i)=>asig.push({player:p.id,grupo:String.fromCharCode(65+gi),pos:i+1})));
  window._asig=asig;
  $('srt').innerHTML=`<div class="sub2" style="margin:8px 0">Vista previa del sorteo:</div>`+G.map((l,gi)=>`<div style="margin:4px 0"><b>${String.fromCharCode(65+gi)}</b> ${asig.filter(a=>a.grupo===String.fromCharCode(65+gi)).map(a=>S.by[a.player].bandera+' '+S.by[a.player].codigo).join(' · ')}</div>`).join('')+`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="guardarSorteo()">✔ Confirmar y guardar</button><button class="btn sm gris" onclick="sortear()">Otro sorteo</button></div>`;
}
async function guardarSorteo(){if(!confirm('Se arman los 96 partidos de grupos con este sorteo. ¿Confirmás?'))return;const r=await rpc('mm_admin_sorteo',{p_apin:S.admin,p_asig:window._asig});if(!r.ok){alert(r.error);return}toast('✔ Sorteo guardado');await cargar(true)}
async function genPins(todos){if(todos&&!confirm('Esto INVALIDA los PIN actuales de todos. ¿Seguro?'))return;const r=await rpc('mm_admin_pins',{p_apin:S.admin,p_todos:todos});if(!r.ok){alert(r.error);return}
  window._pins=r.pins;const url=location.href.split('#')[0].split('?')[0];
  $('pins').innerHTML=r.pins.length?`<div class="row" style="margin:8px 0"><button class="btn sm" onclick="copiarPins()">📋 Copiar todos</button><button class="btn sm gris" onclick="csvPins()">⬇ Excel (CSV)</button></div>`+r.pins.map(x=>`<div class="row sb" style="border-top:1px solid var(--bd);padding:6px 0"><span>${esc((S.by[x.id]||{}).bandera||'')} ${esc(x.nombre)}</span><span><b style="letter-spacing:.15em">${x.pin}</b> <a class="btn sm gris" style="text-decoration:none" target="_blank" href="https://wa.me/?text=${encodeURIComponent(msgPin(x,url))}">WhatsApp</a></span></div>`).join(''):'<div class="sub2">Todos ya tienen PIN.</div>'}
function msgPin(x,url){return `Hola ${x.nombre.split(' ')[0]}! Tu acceso al Mundialito Match Play Elite 2026 (Frigurso FootGolf):\n${url}\nElegí tu nombre (${x.nombre}) y poné el PIN: ${x.pin}`}
function copiarPins(){const url=location.href.split('#')[0].split('?')[0];navigator.clipboard.writeText(_pins.map(x=>x.nombre+' ('+x.pais+'): '+x.pin).join('\n')+'\n\nLink: '+url).then(()=>toast('Copiado'))}
function csvPins(){const b=new Blob(['﻿Nombre;País;PIN\r\n'+_pins.map(x=>[x.nombre,x.pais,x.pin].join(';')).join('\r\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='pins_mundialito.csv';a.click()}
async function adFecha(){const r=RONDAS[+$('afr').value],v=$('afd').value;if(!v){alert('Elegí fecha y hora');return}const f=r.fase;for(const fase of f){const x=await rpc('mm_admin_fecha',{p_apin:S.admin,p_fase:fase,p_fecha_n:r.n==null?null:r.n,p_fecha:new Date(v).toISOString()});if(!x.ok){alert(x.error);return}}toast('✔ Fecha guardada');await cargar(true)}
async function adCerrar(c){const r=RONDAS[+$('afr').value];for(const fase of r.fase){const x=await rpc('mm_admin_cerrar',{p_apin:S.admin,p_fase:fase,p_fecha_n:r.n==null?null:r.n,p_cerrado:c});if(!x.ok){alert(x.error);return}}toast(c?'🔒 Pronósticos cerrados':'🔓 Pronósticos abiertos');await cargar(true)}
async function adDes(g){const o=[0,1,2,3].map(i=>+$('dq'+g+i).value);if(new Set(o).size!==4){alert('Cada jugador tiene que aparecer una sola vez');return}const x=await rpc('mm_admin_desempate',{p_apin:S.admin,p_grupo:g,p_orden:o});if(!x.ok){alert(x.error);return}toast('✔ Desempate fijado');await cargar(true)}

/* ========================= acceso ========================= */
function loginUI(){
  $('login').classList.remove('hide');$('app').classList.add('hide');$('nav').classList.add('hide');
  const pintaLista=q=>{q=(q||'').toLowerCase();$('lgl').innerHTML=S.players.filter(p=>!q||(p.nombre+' '+p.pais).toLowerCase().includes(q)).map(p=>`<button data-id="${p.id}"><span style="font-size:22px">${p.bandera}</span>${esc(p.nombre)}<small>${esc(p.pais)}</small></button>`).join('')||'<div style="padding:12px;color:#7f8fb0">Sin resultados</div>'};
  pintaLista('');$('lgq').oninput=e=>pintaLista(e.target.value);
  $('lgl').onclick=e=>{const b=e.target.closest('button');if(!b)return;const p=S.by[+b.dataset.id];window._lg=p;$('lg1').classList.add('hide');$('lg2').classList.remove('hide');$('lgwho').textContent=p.bandera+' '+p.nombre;$('lgpin').value='';$('lgerr').textContent='';$('lgpin').focus()};
  $('lgback').onclick=()=>{$('lg2').classList.add('hide');$('lg1').classList.remove('hide')};
  $('lgesp').onclick=()=>{S.ses={id:null};localStorage.setItem('mm_ses',JSON.stringify(S.ses));entrar()};
  const ir=async()=>{const pin=$('lgpin').value.trim();if(pin.length<4){$('lgerr').textContent='Poné los 4 dígitos';return}$('lgerr').textContent='Verificando…';
    try{const r=await rpc('mm_login',{p_player:_lg.id,p_pin:pin});if(!r.ok){$('lgerr').textContent=r.error;return}S.ses={id:_lg.id,pin};localStorage.setItem('mm_ses',JSON.stringify(S.ses));entrar()}catch(e){$('lgerr').textContent='Sin conexión'}};
  $('lgok').onclick=ir;$('lgpin').onkeydown=e=>{if(e.key==='Enter')ir()};
}
function entrar(){$('login').classList.add('hide');$('app').classList.remove('hide');$('nav').classList.remove('hide');pintar()}

/* ========================= arranque ========================= */
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.t));
(async function(){
  try{S.ses=JSON.parse(localStorage.getItem('mm_ses')||'null')}catch(e){}
  S.admin=sessionStorage.getItem('mm_adm')||null;
  if(new URLSearchParams(location.search).get('tab'))S.tab=new URLSearchParams(location.search).get('tab');
  await cargar();
  if(!S.cargado){$('login').classList.remove('hide');$('lg1').innerHTML='<div class="err" style="margin-top:30px">'+esc(S.err)+'</div><div class="lk" onclick="location.reload()">Reintentar</div>';return}
  if(S.ses&&S.ses.id){const r=await rpc('mm_login',{p_player:S.ses.id,p_pin:S.ses.pin}).catch(()=>({ok:true}));if(!r.ok){S.ses=null;localStorage.removeItem('mm_ses')}}
  if(S.ses)entrar();else loginUI();
  setInterval(()=>{if(!document.hidden&&S.ses)cargar(true)},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.ses)cargar(true)});
})();
/* service worker: avisa y recarga cuando hay versión nueva */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    const avisar=w=>{if($('upd'))return;const d=document.createElement('div');d.id='upd';d.textContent='🔄 Hay una versión nueva — tocá para actualizar';d.onclick=()=>w.postMessage({type:'SKIP_WAITING'});document.body.appendChild(d)};
    if(reg.waiting&&navigator.serviceWorker.controller)avisar(reg.waiting);
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)avisar(w)})});
  }).catch(()=>{});
  navigator.serviceWorker.addEventListener('controllerchange',()=>location.reload());
}
